<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#090b10">
    <meta name="description" content="TiltSip is an original mobile drink-simulation experiment.">
    <title>TiltSip</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./app.js" defer></script>
  </head>

  <body>
    <div class="app" id="app">
      <section class="screen chooser-screen" id="chooserScreen" aria-labelledby="chooserTitle">
        <header class="brand-lockup" aria-label="TiltSip">
          <span class="brand-lockup__dot" aria-hidden="true"></span>
          <span class="brand-lockup__name">TiltSip</span>
        </header>

        <main class="chooser-content">
          <p class="eyebrow">Choose your pour</p>
          <h1 id="chooserTitle">What’s in your glass?</h1>
          <p class="chooser-intro">Two distinct pours. One convincing little illusion.</p>

          <div class="drink-options" aria-label="Available drinks">
            <button class="drink-card drink-card--beer" type="button" data-drink="beer">
              <span class="drink-card__number" aria-hidden="true">01</span>
              <span class="drink-card__swatch" aria-hidden="true">
                <span class="drink-card__foam"></span>
              </span>
              <span class="drink-card__copy">
                <strong>Beer</strong>
                <small>Amber · bright · lively</small>
              </span>
              <span class="drink-card__arrow" aria-hidden="true">→</span>
            </button>

            <button class="drink-card drink-card--cola" type="button" data-drink="cola">
              <span class="drink-card__number" aria-hidden="true">02</span>
              <span class="drink-card__swatch" aria-hidden="true">
                <span class="drink-card__foam"></span>
              </span>
              <span class="drink-card__copy">
                <strong>Cola</strong>
                <small>Dark · red glow · crisp</small>
              </span>
              <span class="drink-card__arrow" aria-hidden="true">→</span>
            </button>
          </div>
        </main>

        <footer class="chooser-footer">
          <span>Phase one</span>
          <span aria-hidden="true">•</span>
          <span>Manual simulation</span>
        </footer>
      </section>

      <section class="screen drink-screen" id="drinkScreen" aria-labelledby="currentDrinkName" hidden>
        <header class="drink-header">
          <button class="text-button text-button--back" id="backButton" type="button">
            <span aria-hidden="true">←</span>
            <span>Drinks</span>
          </button>

          <div class="drink-title">
            <span>TiltSip</span>
            <h2 id="currentDrinkName">Beer</h2>
          </div>

          <button class="text-button text-button--refill" id="refillButton" type="button">Refill</button>
        </header>

        <main class="glass-area">
          <div class="ambient-orbit" aria-hidden="true"></div>

          <div class="glass-wrap" id="glassWrap" role="img" aria-label="A glass filled with beer">
            <div class="glass">
              <div class="glass__interior">
                <div class="liquid" id="liquid" aria-hidden="true">
                  <div class="liquid__body-glow"></div>
                  <div class="bubbles" id="bubbles"></div>
                  <div class="liquid__surface">
                    <div class="foam" id="foam"></div>
                  </div>
                </div>

                <div class="glass__shine glass__shine--left" aria-hidden="true"></div>
                <div class="glass__shine glass__shine--right" aria-hidden="true"></div>
              </div>

              <div class="glass__rim" aria-hidden="true"></div>
              <div class="glass__base" aria-hidden="true"></div>
            </div>
          </div>

          <p class="level-status" aria-hidden="true">
            <span id="fillReadout">82%</span>
            <span>full</span>
          </p>
        </main>

        <footer class="drink-actions">
          <button class="control-toggle" id="controlsButton" type="button" aria-expanded="false" aria-controls="diagnosticPanel">
            <span class="control-toggle__bars" aria-hidden="true">
              <i></i><i></i><i></i>
            </span>
            <span>Manual controls</span>
          </button>
        </footer>

        <section class="diagnostic-panel" id="diagnosticPanel" aria-label="Manual simulation controls" hidden>
          <div class="diagnostic-panel__header">
            <div>
              <span class="diagnostic-panel__kicker">Diagnostic mode</span>
              <strong>Liquid controls</strong>
            </div>
            <span class="version-label">v0.1.0</span>
          </div>

          <div class="range-control">
            <label for="fillControl">
              <span>Fill level</span>
              <output id="fillOutput" for="fillControl">82%</output>
            </label>
            <input id="fillControl" type="range" min="0" max="100" step="1" value="82">
          </div>

          <div class="range-control">
            <label for="sideTiltControl">
              <span>Side tilt</span>
              <output id="sideTiltOutput" for="sideTiltControl">0°</output>
            </label>
            <input id="sideTiltControl" type="range" min="-18" max="18" step="1" value="0">
          </div>

          <div class="range-control">
            <label for="mouthTiltControl">
              <span>Tilt to mouth</span>
              <output id="mouthTiltOutput" for="mouthTiltControl">0°</output>
            </label>
            <input id="mouthTiltControl" type="range" min="0" max="60" step="1" value="0">
          </div>
        </section>

        <p class="sr-only" id="liveStatus" aria-live="polite"></p>
      </section>
    </div>
  </body>
</html>
